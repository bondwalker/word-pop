<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Word Pop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone game in a sticker-book look. Flat colour blocks, thick navy outlines, hard offset shadows.
   One deliberate light look, so there is no dark variant. */
:root{
  --bg:#FFFFFF; --field:#BFD4FF; --ink:#14285A; --soft:#3F5488;
  --pink:#FF8DC3; --pink-soft:#FFC7E1; --yellow:#FFD43B; --purple:#C9B6FF; --blue:#2F5BEA; --on-blue:#FFFFFF; --heart:#E0458F;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:17px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* score bar */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;
  font-variant-numeric:tabular-nums}
.hud>div{border:3px solid var(--ink);border-radius:22px;padding:5px 16px 6px;min-width:84px;background:var(--bg);
  box-shadow:inset -5px -6px 0 rgba(20,40,90,.13),inset 4px 4px 0 rgba(255,255,255,.7),3px 4px 0 var(--ink)}
.hud>div:first-child{background:var(--yellow)}
.hud>.mid{border:0;padding:0;text-align:center;box-shadow:none;background:none}
.hud .right{text-align:right}
.hud .lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hud .mid .lbl{color:var(--soft)}
.hud .val{font-family:"Bagel Fat One",var(--display);font-weight:400;font-size:30px;line-height:1.05;display:block}
.hud .mid .val{font-size:26px}
.hearts{color:var(--heart);letter-spacing:2px}
.hearts .gone{opacity:.22}

/* play field */
.field{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--field);
  border:3px solid var(--ink);border-radius:20px;margin:0 16px 16px}
.rule{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:15px;font-weight:800;
  pointer-events:none;padding-inline:12px}
.streak{position:absolute;bottom:14px;left:50%;translate:-50% 0;rotate:-2deg;white-space:nowrap;
  font-family:var(--display);font-weight:800;font-size:19px;line-height:1;padding:8px 18px 4px;
  background:var(--pink);border:3px solid var(--ink);border-radius:999px;pointer-events:none}
.streak:empty{display:none}
.bubble{position:absolute;left:0;top:0;border-radius:50%;border:3px solid var(--ink);padding:6px;
  background-color:#EDF3FF;
  background-image:radial-gradient(ellipse 20% 11% at 31% 20%,#FFFFFF 96%,transparent),radial-gradient(circle at 76% 24%,#FFFFFF 0 4%,transparent 4.6%);
  box-shadow:inset -9px -11px 0 rgba(20,40,90,.13),inset 5px 6px 0 rgba(255,255,255,.7),4px 5px 0 var(--ink);
  font-weight:800;font-size:19px;line-height:1.05;display:grid;place-items:center;text-align:center;will-change:transform}
.bubble.pop{animation:pop .22s ease-out forwards;background-color:var(--yellow);box-shadow:inset -9px -11px 0 rgba(20,40,90,.13);pointer-events:none}
.bubble.wrong{animation:fade .5s ease-out forwards;background-color:var(--purple);box-shadow:inset -9px -11px 0 rgba(20,40,90,.13);pointer-events:none}
@keyframes pop{to{scale:1.45;opacity:0}}
@keyframes fade{30%{scale:.9}to{scale:.8;opacity:0}}
.note{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:15px;pointer-events:none;
  padding:3px 12px;border-radius:999px;border:3px solid var(--ink);background:var(--bg);animation:rise 1.4s ease-out forwards}
.note.good{background:var(--yellow)} .note.bad{background:var(--purple)}
@keyframes rise{0%{opacity:0;translate:0 6px}15%{opacity:1}75%{opacity:1}100%{opacity:0;translate:0 -34px}}
@media (prefers-reduced-motion: reduce){ .bubble.pop,.bubble.wrong{animation-duration:.01s} .note{animation:hold 1.4s forwards} }
@keyframes hold{0%,85%{opacity:1}100%{opacity:0}}

/* start and end screens */
.screen{flex:1;min-height:0;overflow-y:auto;padding:22px 20px 28px;display:flex;flex-direction:column;
  align-items:center;gap:16px}
.screen>*{width:100%;max-width:440px;flex:none}
.screen>h1{width:auto;align-self:flex-start;margin:0 0 6px 2px;font-family:"Bagel Fat One",var(--display);font-weight:400;
  font-size:clamp(46px,15.5vw,72px);line-height:1.1;white-space:nowrap;letter-spacing:.01em;color:var(--pink);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink);rotate:-4deg}
h2{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.2;margin:0 0 6px}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
.modes{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:12px;align-content:start}
#start{gap:12px}
#start .tip{font-size:14px;padding:8px 12px}
#start .how li{font-size:14px}
#start>.modes{flex:1 1 0;min-height:150px;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 12px 10px;
  border:3px solid var(--ink);border-radius:18px;scrollbar-width:thin}
#start>.modes:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.topics{font-family:var(--display);font-weight:800;font-size:17px;line-height:1;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-6px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--soft)}
.foot .quiet{font-size:13px;padding:6px 0 6px 8px;white-space:nowrap}
@media (max-height:720px){
  #start{gap:8px;padding-top:12px;padding-bottom:12px}
  #start>h1{font-size:44px;margin-bottom:0}
  #start>.modes{min-height:120px}
  #start .tiplbl{display:none}
  #start .go{min-height:54px;font-size:23px}
}
.topics span{font-family:var(--body);font-weight:700;font-size:13px;color:var(--soft)}
.mode{background:var(--field);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;text-align:left;
  font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;min-height:68px}
.mode:nth-child(4n+2),.mode:nth-child(4n+3){background:var(--pink-soft)}
.mode small{display:block;font-family:var(--body);font-weight:500;font-size:14px;margin-top:2px}
.mode[aria-pressed="true"]{background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}
.modes .mode:last-child:nth-child(odd){grid-column:1/-1}
.tip{border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.4}
.tiplbl{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2}
.how{display:flex;flex-direction:column;gap:8px}
.how li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.chip{flex:none;font-weight:800;font-size:14px;padding:2px 10px;border-radius:999px;border:3px solid var(--ink);min-width:96px;text-align:center}
.chip.good{background:var(--yellow)} .chip.bad{background:var(--purple)}
.go{font-family:var(--display);font-weight:800;background:var(--blue);color:var(--on-blue);border:3px solid var(--ink);
  border-radius:16px;padding:8px 24px 4px;font-size:26px;min-height:62px;box-shadow:5px 5px 0 var(--ink);max-width:435px}
.go:active{translate:3px 3px;box-shadow:2px 2px 0 var(--ink)}
.quiet{background:none;border:0;color:var(--soft);font-weight:700;text-decoration:underline;padding:8px;font-size:15px}
.big{font-family:"Bagel Fat One",var(--display);font-weight:400;font-size:96px;line-height:1;text-align:center;color:var(--yellow);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink);font-variant-numeric:tabular-nums}
.sub{text-align:center;color:var(--soft);font-weight:700}
.review{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;-webkit-user-select:text;user-select:text}
.review li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:2px solid var(--field)}
.review li:first-child{border-top:0}
.review b{font-weight:800}
.review span{color:var(--soft);text-align:right}
/* Computer screens: two columns. Title, tip and Start on the left; topics fill the right. Phones keep the single column. */
@media (min-width:900px){
  #start{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;
    column-gap:48px;row-gap:16px;align-content:stretch;align-items:start;justify-items:stretch;
    padding:40px max(40px,calc((100% - 1280px)/2))}
  #start>*{max-width:none}
  #start>h1{grid-column:1;grid-row:1;font-size:92px;margin:0 0 8px 2px;justify-self:start}
  #start>.tip{grid-column:1;grid-row:2;font-size:16px;padding:12px 16px}
  #start .tiplbl{display:block}
  #start>.how{grid-column:1;grid-row:3}
  #start .how li{font-size:15px}
  #start>.go{grid-column:1;grid-row:4;min-height:66px;font-size:28px}
  #start>.foot{grid-column:1;grid-row:5;font-size:14px}
  #start>.topics{grid-column:2;grid-row:1;align-self:end;font-size:22px;margin-bottom:0}
  #start>.topics span{display:none}
  #start>.modes{grid-column:2;grid-row:2/6;align-self:stretch;min-height:0;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:18px}
  #start .mode{min-height:92px;font-size:21px;padding:12px 16px}
  #start .mode small{font-size:15px}
  #end>*{max-width:620px}
  .hud{padding:16px 32px}
  .hud>div{min-width:120px;padding:6px 22px 8px}
  .hud .val{font-size:40px}
  .hud .mid .val{font-size:34px}
  .field{margin:0 32px 24px}
  .rule{font-size:19px;top:14px}
  .streak{font-size:24px}
  .note{font-size:18px}
}
</style>
</head>
<body>

<section class="screen" id="start">
  <h1>Word Pop</h1>
  <div class="topics">Topics <span>Scroll for more</span></div>
  <div class="modes" id="modes" tabindex="0" aria-label="Topics"></div>
  <div class="tip"><span class="tiplbl">Quick tip</span><p id="tip"></p></div>
  <ul class="how">
    <li><span class="chip good" id="goodChip"></span><span id="goodHelp"></span></li>
    <li><span class="chip bad" id="badChip"></span><span id="badHelp"></span></li>
  </ul>
  <button class="go" id="startBtn" type="button">Start</button>
  <div class="foot"><span>60 seconds · a mistake costs 5 seconds</span><button class="quiet" id="soundBtn" type="button">Sound: on</button></div>
</section>

<header class="hud" id="hud" hidden>
  <div><span class="lbl">Score</span><span class="val" id="score">0</span></div>
  <div class="mid"><span class="lbl">Mistakes</span><span class="val hearts" id="lives"></span></div>
  <div class="right"><span class="lbl">Time</span><span class="val" id="time">60</span></div>
</header>
<main class="field" id="field" hidden>
  <div class="rule" id="rule"></div>
  <div class="streak" id="streak"></div>
</main>

<section class="screen" id="end" hidden>
  <p class="sub" id="endTitle">Time's up!</p>
  <div class="big" id="finalScore">0</div>
  <p class="sub" id="endStats"></p>
  <div class="review" id="wrongBox" hidden>
    <h2 id="wrongTitle"></h2>
    <ul id="wrongList"></ul>
  </div>
  <div class="review" id="missBox" hidden>
    <h2 id="missTitle"></h2>
    <ul id="missList"></ul>
  </div>
  <p class="sub" id="perfect" hidden>No mistakes. Fantastic work!</p>
  <button class="go" id="againBtn" type="button">Play again</button>
  <button class="quiet" id="menuBtn" type="button">Choose another game</button>
</section>

<script>
(function(){
  /* WORD LISTS. Each item is "word|note", items separated by ";".
     "good" words are the ones to tap. The note appears when the word is tapped and on the review screen. */
  function list(s){return s.split(";").map(function(p){var a=p.split("|");return {w:a[0],note:a[1]};});}
  function pairs(s,label){return s.split(" ").map(function(p){var a=p.split(":");return {w:a[1],note:label+a[0]+" → "+a[1]};});}

  var MODES=[
   {id:"irregular",name:"Irregular verbs",sub:"Past simple",rule:"Tap the irregular past verbs",
    goodChip:"went",goodHelp:"Irregular (go → went). Tap it to score.",
    badChip:"walked",badHelp:"Regular (walk → walked). Don't tap it, or you lose 5 seconds.",
    wrongTitle:"Regular verbs you tapped",missTitle:"Irregular verbs you missed",
    good:pairs("go:went buy:bought catch:caught teach:taught think:thought bring:brought feel:felt keep:kept leave:left meet:met pay:paid say:said sell:sold send:sent sleep:slept spend:spent stand:stood tell:told understand:understood win:won write:wrote drive:drove eat:ate fall:fell fly:flew forget:forgot give:gave know:knew ride:rode run:ran see:saw sing:sang speak:spoke swim:swam take:took wear:wore begin:began break:broke choose:chose drink:drank find:found get:got hear:heard hold:held lose:lost make:made build:built grow:grew throw:threw hide:hid shake:shook steal:stole wake:woke become:became draw:drew fight:fought lend:lent mean:meant ring:rang sit:sat",""),
    bad:pairs("walk:walked play:played want:wanted decide:decided stop:stopped try:tried study:studied visit:visited arrive:arrived open:opened listen:listened cook:cooked travel:travelled watch:watched need:needed help:helped carry:carried plan:planned enjoy:enjoyed finish:finished stay:stayed call:called ask:asked live:lived work:worked start:started move:moved change:changed happen:happened remember:remembered show:showed turn:turned wait:waited learn:learned agree:agreed worry:worried clean:cleaned dance:danced laugh:laughed smile:smiled answer:answered invite:invited","Regular: ")},

   {id:"participles",name:"Past participles",sub:"have + ...",rule:"Tap the correct past participles",
    goodChip:"written",goodHelp:"Correct (I have written). Tap it to score.",
    badChip:"wrote",badHelp:"Wrong form or not a real word. Don't tap it.",
    wrongTitle:"Wrong forms you tapped",missTitle:"Past participles you missed",
    good:list("gone|go → went → gone;written|write → wrote → written;eaten|eat → ate → eaten;seen|see → saw → seen;done|do → did → done;taken|take → took → taken;given|give → gave → given;spoken|speak → spoke → spoken;broken|break → broke → broken;chosen|choose → chose → chosen;driven|drive → drove → driven;forgotten|forget → forgot → forgotten;known|know → knew → known;flown|fly → flew → flown;drunk|drink → drank → drunk;swum|swim → swam → swum;begun|begin → began → begun;sung|sing → sang → sung;worn|wear → wore → worn;fallen|fall → fell → fallen;been|be → was/were → been;grown|grow → grew → grown;stolen|steal → stole → stolen;ridden|ride → rode → ridden;hidden|hide → hid → hidden;thrown|throw → threw → thrown;woken|wake → woke → woken;shown|show → showed → shown;bought|buy → bought → bought;caught|catch → caught → caught;taught|teach → taught → taught;thought|think → thought → thought;brought|bring → brought → brought;felt|feel → felt → felt;kept|keep → kept → kept;left|leave → left → left;met|meet → met → met;paid|pay → paid → paid;said|say → said → said;sold|sell → sold → sold;sent|send → sent → sent;slept|sleep → slept → slept;spent|spend → spent → spent;stood|stand → stood → stood;told|tell → told → told;understood|understand → understood → understood;won|win → won → won;made|make → made → made;found|find → found → found;got|get → got → got;heard|hear → heard → heard;held|hold → held → held;lost|lose → lost → lost;built|build → built → built;had|have → had → had;come|come → came → come;become|become → became → become;run|run → ran → run;rung|ring → rang → rung;drawn|draw → drew → drawn;shaken|shake → shook → shaken"),
    bad:list("went|I have gone;wrote|I have written;ate|I have eaten;saw|I have seen;did|I have done;took|I have taken;gave|I have given;spoke|I have spoken;broke|I have broken;chose|I have chosen;drove|I have driven;knew|I have known;flew|I have flown;drank|I have drunk;swam|I have swum;began|I have begun;sang|I have sung;wore|I have worn;fell|I have fallen;grew|I have grown;stole|I have stolen;rode|I have ridden;threw|I have thrown;goed|I have gone;eated|I have eaten;buyed|I have bought;thinked|I have thought;catched|I have caught;came|I have come;ran|I have run;rang|I have rung;drew|I have drawn;shook|I have shaken;hid|I have hidden;woke|I have woken;became|I have become;teached|I have taught;bringed|I have brought;falled|I have fallen;drived|I have driven")},

   {id:"uncountable",name:"Uncountable nouns",sub:"some advice",rule:"Tap the uncountable nouns",
    goodChip:"advice",goodHelp:"Uncountable (some advice). Tap it to score.",
    badChip:"chair",badHelp:"Countable (a chair, two chairs). Don't tap it.",
    wrongTitle:"Countable nouns you tapped",missTitle:"Uncountable nouns you missed",
    good:list("advice|some advice;information|some information;furniture|some furniture;luggage|some luggage;homework|some homework;equipment|some equipment;traffic|a lot of traffic;news|some news;weather|good weather;money|some money;bread|some bread;rice|some rice;water|some water;music|some music;knowledge|a lot of knowledge;research|some research;progress|good progress;accommodation|some accommodation;rubbish|some rubbish;luck|good luck;fun|a lot of fun;software|some software;jewellery|some jewellery;scenery|beautiful scenery;electricity|some electricity;pasta|some pasta;sugar|some sugar;milk|some milk;health|good health;feedback|some feedback;evidence|some evidence;behaviour|good behaviour;clothing|some clothing;cash|some cash;butter|some butter;flour|some flour;salt|some salt;meat|some meat;petrol|some petrol;oil|some oil;air|fresh air;rain|a lot of rain;snow|a lot of snow;sunshine|a lot of sunshine;pollution|a lot of pollution;grammar|English grammar;vocabulary|a lot of vocabulary;housework|some housework;shopping|some shopping;parking|some parking;transport|public transport;permission|some permission;patience|a lot of patience;happiness|a lot of happiness;honesty|complete honesty;confidence|a lot of confidence;mail|some mail;machinery|some machinery;toothpaste|some toothpaste;soap|some soap;honey|some honey;cutlery|some cutlery;laughter|a lot of laughter;damage|some damage"),
    bad:list("chair|a chair, two chairs;suitcase|a suitcase, two suitcases;job|a job, two jobs;idea|an idea, two ideas;journey|a journey, two journeys;car|a car, two cars;coin|a coin, two coins;song|a song, two songs;fact|a fact, two facts;bottle|a bottle, two bottles;apple|an apple, two apples;meal|a meal, two meals;table|a table, two tables;tool|a tool, two tools;book|a book, two books;trip|a trip, two trips;email|an email, two emails;problem|a problem, two problems;minute|a minute, two minutes;sandwich|a sandwich, two sandwiches;suggestion|a suggestion, two suggestions;question|a question, two questions;ticket|a ticket, two tickets;word|a word, two words;machine|a machine, two machines;bag|a bag, two bags;coat|a coat, two coats;dollar|a dollar, two dollars;lesson|a lesson, two lessons;mistake|a mistake, two mistakes;photo|a photo, two photos;holiday|a holiday, two holidays;shop|a shop, two shops;report|a report, two reports;message|a message, two messages;key|a key, two keys;cup|a cup, two cups;flight|a flight, two flights;bus|a bus, two buses;opinion|an opinion, two opinions")},

   {id:"ing",name:"Verb + -ing",sub:"enjoy doing",rule:"Tap the verbs followed by -ing",
    goodChip:"enjoy",goodHelp:"Followed by -ing (enjoy doing). Tap it to score.",
    badChip:"want",badHelp:"Followed by to (want to do). Don't tap it.",
    wrongTitle:"Verbs + to that you tapped",missTitle:"Verbs + -ing you missed",
    good:list("enjoy|enjoy doing;avoid|avoid doing;finish|finish doing;mind|mind doing;suggest|suggest doing;keep|keep doing;practise|practise doing;consider|consider doing;miss|miss doing;imagine|imagine doing;give up|give up doing;risk|risk doing;recommend|recommend doing;deny|deny doing;admit|admit doing;fancy|fancy doing;can't stand|can't stand doing;feel like|feel like doing;look forward to|look forward to doing;put off|put off doing;dislike|dislike doing;postpone|postpone doing;delay|delay doing;involve|involve doing;mention|mention doing;discuss|discuss doing;appreciate|appreciate doing;can't help|can't help doing;be good at|be good at doing;be interested in|be interested in doing;think about|think about doing;dream of|dream of doing;insist on|insist on doing;apologise for|apologise for doing;be used to|be used to doing;carry on|carry on doing;keep on|keep on doing;succeed in|succeed in doing;be worried about|be worried about doing;be tired of|be tired of doing;spend time|spend time doing;have trouble|have trouble doing;it's worth|it's worth doing;resist|resist doing"),
    bad:list("want|want to do;decide|decide to do;hope|hope to do;plan|plan to do;agree|agree to do;promise|promise to do;refuse|refuse to do;learn|learn to do;offer|offer to do;manage|manage to do;need|need to do;afford|afford to do;expect|expect to do;choose|choose to do;arrange|arrange to do;seem|seem to do;would like|would like to do;pretend|pretend to do;wait|wait to do;prepare|prepare to do;deserve|deserve to do;fail|fail to do;tend|tend to do;threaten|threaten to do;demand|demand to do;ask|ask to do;can't wait|can't wait to do;be able|be able to do;be ready|be ready to do;would love|would love to do;be happy|be happy to do;volunteer|volunteer to do;hesitate|hesitate to do;aim|aim to do;claim|claim to do;struggle|struggle to do")},

   {id:"comparatives",name:"Comparatives",sub:"bigger, more careful",rule:"Tap the correct comparatives",
    goodChip:"better",goodHelp:"Correct (good → better). Tap it to score.",

  }
  function begin(){
    score=0;lives=0;timeLeft=ROUND;streak=0;bestStreak=0;hits=0;wrong=[];missed=[];elapsed=0;spawnIn=0.3;
    clearField();
    start.hidden=true;end.hidden=true;hud.hidden=false;field.hidden=false;
    showHud();running=true;
    requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
  }
  function fill(el,items){
    el.innerHTML="";
    items.forEach(function(v){
      var li=document.createElement("li"),b=document.createElement("b"),s=document.createElement("span");
      b.textContent=v.w;s.textContent=v.note==="Correct!"?"correct spelling":v.note;
      li.appendChild(b);li.appendChild(s);el.appendChild(li);
    });
  }
  function finish(timeUp){
    running=false;
    var key="wordpop-best-"+mode.id,best=0;
    try{best=parseInt(localStorage.getItem(key)||"0",10)||0;if(score>best)localStorage.setItem(key,String(score));}catch(e){}
    setTimeout(function(){
      hud.hidden=true;field.hidden=true;end.hidden=false;end.scrollTop=0;
      $("endTitle").textContent=mode.name+" · "+"Time's up!";
      $("finalScore").textContent=score;
      $("endStats").textContent=lives+(lives===1?" mistake":" mistakes")+" · "+hits+" correct pops · best streak "+bestStreak+
        (score>best&&best>0?" · new best score!":(best>0?" · your best: "+Math.max(best,score):""));
      $("wrongBox").hidden=!wrong.length;$("missBox").hidden=!missed.length;
      $("perfect").hidden=!!(wrong.length||missed.length);
      fill($("wrongList"),wrong);fill($("missList"),missed);
    },timeUp?250:700);
  }
  $("startBtn").addEventListener("click",begin);
  $("againBtn").addEventListener("click",begin);
  $("menuBtn").addEventListener("click",function(){clearField();end.hidden=true;start.hidden=false;start.scrollTop=0;});
  $("soundBtn").addEventListener("click",function(){
    soundOn=!soundOn;this.textContent="Sound: "+(soundOn?"on":"off");
  });
})();
</script>

</body>
